# Fork-only: builds a test APK on GitHub's free runners for PRs, manual runs and
# pushes to fork-test/** branches.
# Upstream's workflows use Blacksmith runners, which this fork can't use.
name: Fork test build

on:
  push:
    branches: ["fork-test/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fork-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore test keystore
        id: keystore
        uses: actions/cache/restore@v4
        with:
          path: app/pr-debug.keystore
          key: fork-test-keystore

      - name: Generate test keystore
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -keystore app/pr-debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Metrolist fork test,O=Metrolist,C=GB"

      - name: Save test keystore
        if: steps.keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/pr-debug.keystore
          key: fork-test-keystore

      - name: Build GMS debug APK
        run: chmod +x gradlew && ./gradlew --console=plain assembleGmsDebug --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.forktest
          METROLIST_APP_NAME: Metrolist Test
          METROLIST_DEBUG_KEYSTORE_PATH: pr-debug.keystore
          PULL_REQUEST: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: metrolist-test-apk
          path: app/build/outputs/apk/gms/debug/*.apk
